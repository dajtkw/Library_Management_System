server:
  port: 8080

spring:
  application:
    name: library_management
  datasource:
    url: jdbc:mysql://localhost:3306/library_management?useSSL=false&serverTimezone=Asia/Saigon&characterEncoding=UTF-8
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Saigon
  jackson:
    time-zone: Asia/Saigon
